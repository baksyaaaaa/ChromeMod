name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the jar as a GitHub Release

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one version failing never stops the others
      matrix:
        include:
          - mc: "1.21.11"
            java: 21
            gradle: "9.2.0"
            newer: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Pick the Minecraft version
        run: |
          sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties
          sed -i "s/^archives_base_name=.*/archives_base_name=chrome-client-${{ matrix.mc }}/" gradle.properties
          if [ "${{ matrix.newer }}" = "true" ]; then cp build-26.gradle build.gradle; fi

      - name: Look up the newest Fabric Loader and Fabric API for this Minecraft version
        run: |
          MC=${{ matrix.mc }}
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -fsS -A "chrome-client-ci" -G "https://api.modrinth.com/v2/project/fabric-api/version" \
                  --data-urlencode "game_versions=[\"$MC\"]" --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          echo "Minecraft $MC | Fabric Loader $LOADER | Fabric API $API"
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties; fi
          if [ -n "$API" ] && [ "$API" != "null" ]; then sed -i "s/^fabric_api_version=.*/fabric_api_version=$API/" gradle.properties; fi
          cat gradle.properties

      - name: Build
        run: set -o pipefail; gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show the cause
        if: failure()
        run: |
          echo "### Build failed for Minecraft ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|What went wrong" -A2 build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-client-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            build.log

      - name: Publish the jar as a GitHub Release (the launcher downloads it from here)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          TAG="build-${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "Chrome Client $VER" --notes "Minecraft ${{ matrix.mc }}" --latest
          fi
