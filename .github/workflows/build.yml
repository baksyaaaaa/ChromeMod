name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the jar as a GitHub Release

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one version failing never stops the others
      matrix:
        include:
          - mc: "1.21.11"
            java: 21
            gradle: "9.2.0"
            newer: false
          - mc: "26.3"
            java: 25
            gradle: "9.2.0"
            newer: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Pick the Minecraft version
        run: |
          sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties
          sed -i "s/^archives_base_name=.*/archives_base_name=chrome-client-${{ matrix.mc }}/" gradle.properties
          if [ "${{ matrix.newer }}" = "true" ]; then
            cp build-26.gradle build.gradle
            sed -i 's/"minecraft": "[^"]*"/"minecraft": ">=26.1"/; s/"java": "[^"]*"/"java": ">=25"/' src/main/resources/fabric.mod.json
          else
            sed -i 's/"minecraft": "[^"]*"/"minecraft": ">=1.21.11 <1.22"/' src/main/resources/fabric.mod.json
          fi

      - name: Look up the newest Fabric Loader and Fabric API for this Minecraft version
        run: |
          MC=${{ matrix.mc }}
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -fsS -A "chrome-client-ci" -G "https://api.modrinth.com/v2/project/fabric-api/version" \
                  --data-urlencode "game_versions=[\"$MC\"]" --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          echo "Minecraft $MC | Fabric Loader $LOADER | Fabric API $API"
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties; fi
          if [ -n "$API" ] && [ "$API" != "null" ]; then sed -i "s/^fabric_api_version=.*/fabric_api_version=$API/" gradle.properties; fi
          cat gradle.properties

      - name: Build
        run: set -o pipefail; gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Dump the 26.x class names and signatures into a branch (to read them)
        if: always() && matrix.newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p explore
          MCJAR=$(find ~/.gradle -name "*.jar" -iname "*minecraft*" -size +10M 2>/dev/null | head -5)
          echo "$MCJAR" > explore/jars.txt
          for J in $MCJAR; do unzip -Z1 "$J" | grep '\.class$' | sed 's/\.class$//' > "explore/classes-$(basename $J).txt"; done
          find ~/.gradle -name "fabric-*.jar" -size +5k 2>/dev/null | grep -v sources | while read F; do
            echo "== $F"; unzip -Z1 "$F" | grep '\.class$' | grep '/api/' | sed 's/\.class$//'
          done > explore/fabric-api-classes.txt
          CP=$(echo "$MCJAR" | tr '\n' ':')
          for J in $MCJAR; do
            unzip -Z1 "$J" | grep -E '^net/minecraft/client/(gui/[A-Za-z]+|gui/screens/[A-Za-z]+|gui/components/[A-Za-z]+|Minecraft|KeyMapping|Options|player/[A-Za-z]+|renderer/[A-Za-z]+|model/[A-Za-z/]+|multiplayer/[A-Za-z]+|resources/[A-Za-z]+|sounds/[A-Za-z]+)\.class$' | sed 's/\.class$//; s#/#.#g' | head -400 | xargs javap -public -cp "$J" 2>/dev/null
          done > explore/signatures.txt || true
          wc -c explore/*
          git config user.name ci; git config user.email ci@example.com
          git checkout -q --orphan explore26 && git rm -rfq --cached . >/dev/null 2>&1 || true
          git add -f explore && git commit -qm "26.x names" && git push -f -q origin explore26 || true

      - name: Show the cause
        if: failure()
        run: |
          echo "### Build failed for Minecraft ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|What went wrong" -A2 build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-client-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            build.log

      - name: Publish the jar as a GitHub Release (the launcher downloads it from here)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          TAG="build-${{ github.run_number }}"
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$JAR" --clobber && break
            else
              gh release create "$TAG" "$JAR" --title "Chrome Client $VER" --notes "Minecraft builds" --latest && break
            fi
            sleep $((RANDOM % 8 + 2))
          done
