name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Look up the newest Fabric Loader and Fabric API for this Minecraft version
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -fsS -A "chrome-client-ci" -G "https://api.modrinth.com/v2/project/fabric-api/version" \
                  --data-urlencode "game_versions=[\"$MC\"]" --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          echo "Minecraft $MC | Fabric Loader $LOADER | Fabric API $API"
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties; fi
          if [ -n "$API" ] && [ "$API" != "null" ]; then sed -i "s/^fabric_api_version=.*/fabric_api_version=$API/" gradle.properties; fi
          cat gradle.properties

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-client-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
