name: Build PolyPlus copy

# Chrome Client's modified copy of PolyPlus (polyplus/ folder, GPL-3.0-only, based on Polyfrost/PolyPlus)
on:
  push:
    paths:
      - 'polyplus/**'
      - '.github/workflows/poly.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Poly ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.1", "26.2", "26.3"]
    defaults:
      run:
        working-directory: polyplus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew ":${{ matrix.mc }}-fabric:build" -x test -x detekt -x checkstyleMain -x checkstyleTest --stacktrace 2>&1 | tee ../poly-build.log
      - name: Show the errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 ../poly-build.log | head -120
      - name: Find the jar
        id: jar
        run: |
          mapfile -t jars < <(find "versions/${{ matrix.mc }}-fabric/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          echo "found: ${jars[*]}"
          [ "${#jars[@]}" -ge 1 ] || exit 1
          cp "${jars[0]}" "ChromePoly-${{ matrix.mc }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-poly-${{ matrix.mc }}
          path: polyplus/ChromePoly-${{ matrix.mc }}.jar
      - name: Publish (the launcher downloads it from this release)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=polyplus-latest
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "ChromePoly-${{ matrix.mc }}.jar" --clobber && break
            else
              gh release create "$TAG" "ChromePoly-${{ matrix.mc }}.jar" --title "Chrome Client PolyPlus build" --notes "Modified copy of PolyPlus (GPL-3.0-only). Source: the polyplus folder." --latest=false && break
            fi
            sleep $((RANDOM % 8 + 2))
          done
