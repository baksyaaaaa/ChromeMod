name: Inspect OneConfig
on:
  push:
    paths: [".github/workflows/inspect.yml"]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Download and search
        run: |
          mkdir -p w && cd w
          curl -sfL -o i.jar "https://repo.polyfrost.org/releases/org/polyfrost/oneconfig/internal/1.9.0/internal-1.9.0.jar" || curl -sfL -o i.jar "https://repo.polyfrost.org/snapshots/org/polyfrost/oneconfig/internal/1.9.0/internal-1.9.0.jar"
          ls -la i.jar
          mkdir x && cd x && unzip -qo ../i.jar
          javap -p -c -constants -cp . org.polyfrost.oneconfig.internal.OneConfigConfig > /tmp/c.txt
          echo "=== KEYBIND DEFAULTS ==="
          sed -n 1175,1215p /tmp/c.txt
          echo "=== OPENING BEHAVIOR ==="
          sed -n 510,560p /tmp/c.txt
          echo "=== ctor of OneConfigKeybind ==="
          javap -p -cp . org.polyfrost.oneconfig.api.ui.v1.keybind.OneConfigKeybind 2>&1 | head -30 || true
