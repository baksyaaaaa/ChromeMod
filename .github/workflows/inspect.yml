name: Inspect OneConfig
on:
  push:
    paths: [".github/workflows/inspect.yml"]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p w && cd w
          curl -sfL -o i.jar "https://repo.polyfrost.org/releases/org/polyfrost/oneconfig/internal/1.9.0/internal-1.9.0.jar"
          mkdir x && cd x && unzip -qo ../i.jar
          javap -p -c -constants -cp . org.polyfrost.oneconfig.internal.OneConfigConfig > /tmp/c.txt
          echo "=== DEFAULT KEYS in order ==="
          grep -nE "putstatic.*(Keybind|keybind)|Keys.getKey|HUD_ACTION_MODS|bipush|iconst_[0-9]$" /tmp/c.txt | sed -n '/1182/,$p' | grep -E "putstatic|getKey" | head -70
          echo "=== openEditor callers ==="
          for c in org.polyfrost.oneconfig.internal.ui.shell.ShellKt; do javap -p -c -cp . $c | grep -n -B12 "openEditor" | head -80; done
