name: Inspect OneConfig
on:
  push:
    paths: [".github/workflows/inspect.yml"]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p w && cd w
          curl -sfL -o i.jar "https://repo.polyfrost.org/releases/org/polyfrost/oneconfig/internal/1.9.0/internal-1.9.0.jar"
          mkdir x && cd x && unzip -qo ../i.jar
          javap -p -c -constants -cp . org.polyfrost.oneconfig.internal.OneConfigConfig > /tmp/c.txt
          echo "=== DEFAULT KEYS ==="
          awk 'NR>=1175 && NR<=1500' /tmp/c.txt | grep -E "putstatic|getKey|getstatic.*HUD_|iconst_|bipush" | cut -c1-160
          echo "=== ShellKt openEditor ==="
          javap -p -c -cp . org.polyfrost.oneconfig.internal.ui.shell.ShellKt | grep -n -B14 "openEditor" | cut -c1-170 | head -90
